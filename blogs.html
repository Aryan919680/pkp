<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Manage Blogs - Admin</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; background: #f5f7fa; }
    h1 { color: #0f5132; }
    .form-group { margin-bottom: 10px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; }
    input, textarea { width: 100%; padding: 8px; border-radius: 6px; border: 1px solid #ccc; }
    button { padding: 8px 14px; border: none; border-radius: 6px; cursor: pointer; }
    .btn-primary { background: #0f5132; color: #fff; }
    .btn-danger { background: #d9534f; color: #fff; margin-left: 5px; }
    .blog-item { background: white; padding: 15px; border-radius: 8px; margin: 10px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
    .blog-item h3 { margin: 0; color: #0f5132; }
  </style>
</head>
<body>
  <h1>Manage Blogs</h1>
  <p id="userEmail"></p>
  <button id="logoutBtn">Logout</button>

  <h2>Add / Edit Blog</h2>
  <div>
    <div class="form-group">
      <label>Title</label>
      <input type="text" id="title">
    </div>
    <div class="form-group">
      <label>Content</label>
      <textarea id="content" rows="4"></textarea>
    </div>
    <button class="btn-primary" id="saveBtn">Save Blog</button>
  </div>

  <h2>All Blogs</h2>
  <div id="blogsList"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
    import { getFirestore, collection, addDoc, getDocs, deleteDoc, doc, updateDoc } from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";

    // ✅ Firebase Config
const firebaseConfig = {
  apiKey: "AIzaSyAk7A6uU8jxO_tVFD4Z9sunNoCW9KNcqD0",
  authDomain: "pkp-global.firebaseapp.com",
  projectId: "pkp-global",
  storageBucket: "pkp-global.firebasestorage.app",
  messagingSenderId: "111734452310",
  appId: "1:111734452310:web:d9a087aa5899bcc96b4bf7",
  measurementId: "G-K599S5T7XR"
};


    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const ALLOWED_EMAIL = "pkpglobalexport@gmail.com";
    let editId = null;

    // ✅ Keep existing login session
    onAuthStateChanged(auth, (user) => {
      console.log("Auth state changed:", user);
      if (user && user.email === ALLOWED_EMAIL) {
        console.log("User is logged in:", user.email);
        document.getElementById("userEmail").textContent = `Logged in as: ${user.email}`;
        loadBlogs();
      }
    //   } else {
    //     window.location.href = "login.html";
    //   }
    });

    // ✅ Logout
    document.getElementById("logoutBtn").addEventListener("click", () => {
      signOut(auth).then(() => window.location.href = "login.html");
    });

    // ✅ Save Blog
    document.getElementById("saveBtn").addEventListener("click", async () => {
      const title = document.getElementById("title").value;
      const content = document.getElementById("content").value;

      if (!title || !content) {
        alert("Please fill in all fields!");
        return;
      }

      if (editId) {
        await updateDoc(doc(db, "blogs", editId), { title, content });
        editId = null;
      } else {
        await addDoc(collection(db, "blogs"), { title, content, createdAt: new Date() });
      }

      document.getElementById("title").value = "";
      document.getElementById("content").value = "";
      loadBlogs();
    });

    // ✅ Load Blogs
    async function loadBlogs() {
      const blogsList = document.getElementById("blogsList");
      blogsList.innerHTML = "";
      const querySnapshot = await getDocs(collection(db, "blogs"));
      querySnapshot.forEach((docSnap) => {
        const blog = docSnap.data();
        const div = document.createElement("div");
        div.classList.add("blog-item");
        div.innerHTML = `
          <h3>${blog.title}</h3>
          <p>${blog.content}</p>
          <button class="btn-primary" onclick="editBlog('${docSnap.id}', '${blog.title}', \`${blog.content}\`)">Edit</button>
          <button class="btn-danger" onclick="deleteBlog('${docSnap.id}')">Delete</button>
        `;
        blogsList.appendChild(div);
      });
    }

    // ✅ Global functions
    window.deleteBlog = async (id) => {
      await deleteDoc(doc(db, "blogs", id));
      loadBlogs();
    };

    window.editBlog = (id, title, content) => {
      document.getElementById("title").value = title;
      document.getElementById("content").value = content;
      editId = id;
    };
  </script>
</body>
</html>
